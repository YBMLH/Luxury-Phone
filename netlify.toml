# Netlify configuration for Luxury Phone.
# Netlify auto-detects Next.js and uses its free Next.js runtime —
# no extra setup needed beyond this file.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Browser security headers (same as vercel.json, for parity).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
